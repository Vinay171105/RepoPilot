<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoPilot</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#656d76; --card:#f6f8fa; --line:#d0d7de; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --card:#161b22; --line:#30363d; --accent:#58a6ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  .row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  input { flex:1; min-width:180px; } button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  #status { color:var(--muted); font-size:.9rem; min-height:1.3em; margin-bottom:8px; }
  #answer { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; display:none; }
  #cites { margin-top:12px; } .cite { font:13px ui-monospace, monospace; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; margin:4px 6px 0 0; display:inline-block; }
</style>
</head>
<body>
<main>
  <h1>RepoPilot</h1>
  <p class="sub">Ask how a codebase works. Every citation points at code that was actually retrieved.</p>
  <div class="row">
    <input id="src" placeholder="owner/name, GitHub URL, or local path">
    <button id="idxBtn">Index</button>
  </div>
  <div class="row">
    <select id="repo"></select>
    <input id="q" placeholder="How does authentication work?">
    <button id="askBtn">Ask</button>
  </div>
  <div id="status"></div>
  <div id="answer"></div>
  <div id="cites"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const status = t => $("status").textContent = t;
async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}
async function loadRepos(select) {
  const names = await api("/repos");
  $("repo").innerHTML = "";
  names.forEach(n => $("repo").append(new Option(n, n, false, n === select)));
}
$("idxBtn").onclick = async () => {
  $("idxBtn").disabled = true; status("Indexing... this can take a minute for large repos.");
  try { const r = await api("/index", {source: $("src").value}); status(`Indexed ${r.name}: ${r.files} files, ${r.chunks} chunks.`); await loadRepos(r.name); }
  catch (e) { status("Error: " + e.message); } finally { $("idxBtn").disabled = false; }
};
$("askBtn").onclick = async () => {
  if (!$("repo").value || !$("q").value) return;
  $("askBtn").disabled = true; status("Thinking...");
  try {
    const r = await api("/ask", {repo: $("repo").value, question: $("q").value});
    $("answer").style.display = "block"; $("answer").textContent = r.answer;
    $("cites").replaceChildren(...r.citations.map(c => { const s = document.createElement("span"); s.className = "cite"; s.textContent = `${c.file}:${c.start_line}-${c.end_line}`; return s; }));
    status(r.dropped_citations.length ? `${r.dropped_citations.length} citation(s) removed by the grounding guard.` : "");
  } catch (e) { status("Error: " + e.message); } finally { $("askBtn").disabled = false; }
};
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("askBtn").click(); });
loadRepos().catch(() => {});
</script>
</body>
</html>
