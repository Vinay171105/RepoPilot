[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "Ask questions about any codebase. Answers cite real files and lines, powered by open models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "httpx>=0.25", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.7"]
dev = ["pytest>=7"]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repopilot = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
